spring.application.name=backend-app
spring.datasource.url=jdbc:postgresql://${PGPGHOST}/${PGDATABASE}?sslmode=require
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

# La magia de Hibernate: Crea las tablas automáticamente si no existen
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Puerto dinámico para la nube
server.port=${PORT:8080}
jwt.secret=${JWT_SECRET}
# ==========================
# GROQ
# ==========================

spring.ai.openai.base-url=https://api.groq.com/openai/v1

spring.ai.openai.api-key=${GROQ_API_KEY}

spring.ai.openai.chat.model=llama-3.3-70b-versatile

spring.ai.openai.chat.temperature=0.2